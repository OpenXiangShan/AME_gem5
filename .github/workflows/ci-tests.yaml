---
# Run checks when a pull request is opened, updated, or marked ready.

name: CI Tests

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
    cancel-in-progress: true

# Six runners share open06. Limit build and simulation parallelism.
# Jobs run on the host; these settings are not CPU or memory hard limits.
# Repository Actions variables can override these defaults.
env:
    CI_BUILD_JOBS: ${{ vars.CI_BUILD_JOBS || '16' }}

jobs:
    pre-commit:
    # runs on github hosted runner
        runs-on: ubuntu-24.04
        if: github.event.pull_request.draft == false
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.10'
            - uses: pre-commit/action@v3.0.1

    # Runs on the github hosted runner
    # Iterates through all of the commits in the the PR and runs
    # clang-format to make sure that nothing changes.
    clang-format-check:
        runs-on: ubuntu-24.04
        if: github.event.pull_request.draft == false
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0  # Need full history to get the merge base

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.10'

            - name: Install clang-format
              run: sudo apt-get install -y clang-format

            - name: Get merge base commit
              id: get-base-commit
              run: |
                  # Calculate the merge base between the target branch and the PR branch
                  BASE_SHA="${{ github.event.pull_request.base.sha }}"
                  HEAD_SHA="${{ github.event.pull_request.head.sha }}"
                  MERGE_BASE=$(git merge-base $BASE_SHA $HEAD_SHA)

                  echo "base_commit=$MERGE_BASE" >> $GITHUB_OUTPUT

            - name: Run clang-format check
              run: |
                  python util/run-git-clang-format.py --verbose --ci-pr-base-commit ${{ steps.get-base-commit.outputs.base_commit }} --ignore ext

    unittests-all-fast-opt:
        strategy:
            fail-fast: false
            matrix:
                type: [fast, opt]
        runs-on: [self-hosted, linux, x64, bosc, open]
        if: github.event.pull_request.draft == false
        timeout-minutes: 60
        env:
            CC: gcc
            CXX: g++
        steps:
            - name: Isolate Git configuration for this job
              shell: bash
              run: |
                  umask 077
                  job_git_config=$(mktemp "$RUNNER_TEMP/gitconfig.XXXXXX")
                  if [ -f "$HOME/.gitconfig" ]; then
                      cp "$HOME/.gitconfig" "$job_git_config"
                  fi
                  echo "GIT_CONFIG_GLOBAL=$job_git_config" >> "$GITHUB_ENV"
            - uses: actions/checkout@v7

            - name: Check host build tools
              run: |
                  for tool in "$CC" "$CXX" scons python3 python3-config pkg-config protoc make; do
                      command -v "$tool" || exit 1
                  done
                  "$CC" --version
                  python3-config --includes
                  pkg-config --exists python3-embed protobuf zlib
            - name: CI Unittests (${{ matrix.type }})
              working-directory: ${{ github.workspace }}
              run: scons --no-compress-debug build/ALL/unittests.${{ matrix.type }} -j "$CI_BUILD_JOBS"
            - run: echo "This job's status is ${{ job.status }}."

    clang-fast-compilation:
        # Clang is more strict than GCC. This job checks that gem5 compiles
        # with Clang. It compiles build/ALL/gem5.fast to maximize the change
        # for compilation error to be exposed.
        runs-on: [self-hosted, linux, x64, bosc, open]
        if: github.event.pull_request.draft == false
        timeout-minutes: 90
        env:
            CC: clang-19
            CXX: clang++-19
        steps:
            - name: Isolate Git configuration for this job
              shell: bash
              run: |
                  umask 077
                  job_git_config=$(mktemp "$RUNNER_TEMP/gitconfig.XXXXXX")
                  if [ -f "$HOME/.gitconfig" ]; then
                      cp "$HOME/.gitconfig" "$job_git_config"
                  fi
                  echo "GIT_CONFIG_GLOBAL=$job_git_config" >> "$GITHUB_ENV"
            - uses: actions/checkout@v7

            - name: Check host build tools
              run: |
                  for tool in "$CC" "$CXX" scons python3 python3-config pkg-config protoc make; do
                      command -v "$tool" || exit 1
                  done
                  "$CC" --version
                  python3-config --includes
                  pkg-config --exists python3-embed protobuf zlib
            - name: Clang Compilation
              working-directory: ${{ github.workspace }}
              run: scons build/ALL/gem5.fast -j "$CI_BUILD_JOBS"

# Custom Ztt floating-point unit tests and mixed-input ISA regression.
    ztt-tests:
        name: ztt-float-unit-test
        runs-on: [self-hosted, linux, x64, bosc, open]
        if: github.event.pull_request.draft == false
        timeout-minutes: 120
        defaults:
            run:
                shell: bash
        env:
            CC: gcc
            CXX: g++
        steps:
            - name: Isolate Git configuration for this job
              shell: bash
              run: |
                  umask 077
                  job_git_config=$(mktemp "$RUNNER_TEMP/gitconfig.XXXXXX")
                  if [ -f "$HOME/.gitconfig" ]; then
                      cp "$HOME/.gitconfig" "$job_git_config"
                  fi
                  echo "GIT_CONFIG_GLOBAL=$job_git_config" >> "$GITHUB_ENV"
            - uses: actions/checkout@v7

            - name: Check host build tools
              run: |
                  for tool in "$CC" "$CXX" scons python3 python3-config pkg-config protoc make; do
                      command -v "$tool" || exit 1
                  done
                  "$CC" --version
                  python3-config --includes
                  pkg-config --exists python3-embed protobuf zlib

            - name: Build RISC-V simulator and Ztt floating-point unit tests
              run: |
                  mkdir -p ci-results
                  scons build/RISCV/gem5.opt \
                    build/RISCV/arch/riscv/insts/ztt_float.test.opt \
                    -j "$CI_BUILD_JOBS" 2>&1 | tee ci-results/ztt-build.log

            - name: Run Ztt floating-point unit tests
              timeout-minutes: 5
              run: |
                  build/RISCV/arch/riscv/insts/ztt_float.test.opt \
                    --gtest_output=xml:ci-results/ztt-float.xml \
                    2>&1 | tee ci-results/ztt-float.log

            - name: Install AME example toolchain
              timeout-minutes: 10
              run: |
                  bash scripts/build_toolchain.sh \
                    2>&1 | tee ci-results/ztt-toolchain.log

            - name: Run mixed-input GEMM ISA regression
              timeout-minutes: 10
              run: |
                  make -C example/gemm_mixed_source_types test \
                    2>&1 | tee ci-results/ztt-mixed-types.log

    example-operator-tests:
        name: example-operator-tests
        runs-on: ubuntu-24.04
        if: github.event.pull_request.draft == false
        timeout-minutes: 180
        env:
            CI_BUILD_JOBS: '4'
        steps:
            - uses: actions/checkout@v7

            - name: Install gem5 build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    build-essential \
                    m4 \
                    scons \
                    python3-dev \
                    pkg-config \
                    zlib1g-dev \
                    libprotobuf-dev \
                    protobuf-compiler \
                    libprotoc-dev

            - name: Build RISC-V gem5
              run: |
                  mkdir -p ci-results
                  scons build/RISCV/gem5.opt -j "$CI_BUILD_JOBS" \
                    2>&1 | tee ci-results/example-gem5-build.log

            - name: Install AME example toolchain
              timeout-minutes: 10
              run: |
                  bash scripts/build_toolchain.sh \
                    2>&1 | tee ci-results/example-toolchain.log

            - name: Run existing operator examples
              timeout-minutes: 30
              run: |
                  make -C example \
                    gemm_fp32 gemm_int8 gemm_mixed \
                    gelu softmax mha ffn rope rmsnorm \
                    2>&1 | tee ci-results/example-operators.log

            - name: Upload example test results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: example-operator-results-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      ci-results/example-*.log
                      example/build/reports/
                      example/*/build/reports/
                      example/*/build/logs/
                  if-no-files-found: warn

    ci-tests:
    # Wait for all independent checks, including both unit-test variants.
    # Only an all-success result passes this required check.
        runs-on: ubuntu-24.04
        if: always() && github.event.pull_request.draft == false
        needs:
            - clang-fast-compilation
            - unittests-all-fast-opt
            - pre-commit
            - clang-format-check
            - ztt-tests
            - example-operator-tests
        steps:
            - name: Check all required jobs
              env:
                  JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
              run: |
                  for result in $JOB_RESULTS; do
                      if [ "$result" != success ]; then
                          echo "Required job did not succeed: $result"
                          exit 1
                      fi
                  done
                  echo "All required checks passed."
