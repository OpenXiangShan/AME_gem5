---
# Run checks when a pull request is opened, updated, or marked ready.

name: CI Tests

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
    cancel-in-progress: true

# Six runners share open06. Limit build and simulation parallelism.
# Jobs run on the host; these settings are not CPU or memory hard limits.
# Repository Actions variables can override these defaults.
env:
    CI_BUILD_JOBS: ${{ vars.CI_BUILD_JOBS || '16' }}
    CI_TEST_THREADS: ${{ vars.CI_TEST_THREADS || '2' }}

jobs:
    pre-commit:
    # runs on github hosted runner
        runs-on: ubuntu-24.04
        if: github.event.pull_request.draft == false
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.10'
            - uses: pre-commit/action@v3.0.1

    # Runs on the github hosted runner
    # Iterates through all of the commits in the the PR and runs
    # clang-format to make sure that nothing changes.
    clang-format-check:
        runs-on: ubuntu-24.04
        if: github.event.pull_request.draft == false
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0  # Need full history to get the merge base

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.10'

            - name: Install clang-format
              run: sudo apt-get install -y clang-format

            - name: Get merge base commit
              id: get-base-commit
              run: |
                  # Calculate the merge base between the target branch and the PR branch
                  BASE_SHA="${{ github.event.pull_request.base.sha }}"
                  HEAD_SHA="${{ github.event.pull_request.head.sha }}"
                  MERGE_BASE=$(git merge-base $BASE_SHA $HEAD_SHA)

                  echo "base_commit=$MERGE_BASE" >> $GITHUB_OUTPUT

            - name: Run clang-format check
              run: |
                  python util/run-git-clang-format.py --verbose --ci-pr-base-commit ${{ steps.get-base-commit.outputs.base_commit }} --ignore ext

    get-date:
    # We use the date to label caches. A cache is a a "hit" if the date is the
    # request binary and date are the same as what is stored in the cache.
    # This essentially means the first job to run on a given day for a given
    # binary will always be a "miss" and will have to build the binary then
    # upload it as that day's binary to upload. While this isn't the most
    # efficient way to do this, the alternative was to run take a hash of the
    # `src` directory contents and use it as a hash. We found there to be bugs
    # with the hash function where this task would timeout. This approach is
    # simple, works, and still provides some level of caching.
        runs-on: ubuntu-24.04
        outputs:
            date: ${{ steps.date.outputs.date }}
        steps:
            - name: Get the current date
              id: date
              run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    unittests-all-fast-opt:
        strategy:
            matrix:
                type: [fast, opt]
        runs-on: [self-hosted, linux, x64, bosc, open]
        if: github.event.pull_request.draft == false
        needs: [pre-commit] # only runs if pre-commit passes.
        timeout-minutes: 60
        env:
            CC: gcc
            CXX: g++
        steps:
            - uses: actions/checkout@v7

            - name: Check host build tools
              run: |
                  for tool in "$CC" "$CXX" scons python3 python3-config pkg-config protoc make; do
                      command -v "$tool" || exit 1
                  done
                  "$CC" --version
                  python3-config --includes
                  pkg-config --exists python3-embed protobuf zlib
            - name: CI Unittests (${{ matrix.type }})
              working-directory: ${{ github.workspace }}
              run: scons --no-compress-debug build/ALL/unittests.${{ matrix.type }} -j "$CI_BUILD_JOBS"
            - run: echo "This job's status is ${{ job.status }}."

    testlib-quick-matrix:
        runs-on: ubuntu-24.04
        if: github.event.pull_request.draft == false
        needs: [pre-commit]
        steps:
            - uses: actions/checkout@v7
            - name: Install jq
              run: sudo apt-get update && sudo apt-get install -y jq

            - name: Get directories for testlib-quick
              working-directory: ${{ github.workspace }}/tests
              id: dir-matrix
              run: |
                  unset PREV
                  echo "test-dirs-matrix=$(\
                    ./main.py list gem5 \
                    --suites \
                    --exclude-tags gcn_gpu | \
                    grep '^SuiteUID:' | \
                    cut -d: -f2 | \
                    cut -d/ -f 2- | \
                    xargs dirname | \
                    sort -u  | \
                    while read x; do \
                      if [ -z "${PREV}" ] || [ "$x" != "${PREV}/*" ]; then \
                        PREV=$x; \
                        echo $x; \
                      fi; \
                    done  | \
                    jq -ncR '[inputs]'\
                  )" >>$GITHUB_OUTPUT

            - name: Get the build targets for testlib-quick-gem5-builds
              working-directory: ${{ github.workspace }}/tests
              id: build-matrix
              run: echo "build-matrix=$(./main.py list --build-targets --exclude-tags VEGA_X86 -q | jq -ncR '[inputs]')" >>$GITHUB_OUTPUT

        outputs:
            build-matrix: ${{ steps.build-matrix.outputs.build-matrix }}
            test-dirs-matrix: ${{ steps.dir-matrix.outputs.test-dirs-matrix }}

    clang-fast-compilation:
        # gem5 binaries built in `quick-gem5-builds` always use GCC.
        # Clang is more strict than GCC. This job checks that gem5 compiles
        # with Clang. It compiles build/ALL/gem5.fast to maximize the change
        # for compilation error to be exposed.
        runs-on: [self-hosted, linux, x64, bosc, open]
        if: github.event.pull_request.draft == false
        needs: [pre-commit]
        timeout-minutes: 90
        env:
            CC: clang-19
            CXX: clang++-19
        steps:
            - uses: actions/checkout@v7

            - name: Check host build tools
              run: |
                  for tool in "$CC" "$CXX" scons python3 python3-config pkg-config protoc make; do
                      command -v "$tool" || exit 1
                  done
                  "$CC" --version
                  python3-config --includes
                  pkg-config --exists python3-embed protobuf zlib
            - name: Clang Compilation
              working-directory: ${{ github.workspace }}
              run: scons build/ALL/gem5.fast -j "$CI_BUILD_JOBS"

    macos-compilation:
        runs-on: macos-26
        if: github.event.pull_request.draft == false
        needs: [pre-commit, get-date]

        strategy:
            fail-fast: false
            matrix:
                type: [fast, opt]

        steps:
            - name: Checkout the gem5 repository
              uses: actions/checkout@v7

            - name: Install the gem5 dependencies
              run: |
                  brew update
                  brew install \
                    scons \
                    python \
                    pkg-config \
                    protobuf \
                    grpc \
                    boost


            - name: Restore macOS build/ALL cache
              uses: actions/cache/restore@v6
              with:
                  path: build/ALL
                  key: macos-all-gem5-${{ matrix.type }}-${{ needs.get-date.outputs.date }}
                  restore-keys: |
                      macos-all-gem5-${{ matrix.type }}

            - name: Compile gem5.${{ matrix.type }}
              working-directory: ${{ github.workspace }}
              run: scons build/ALL/gem5.${{ matrix.type }} -j $(sysctl -n hw.ncpu)
              timeout-minutes: 90

    testlib-quick-gem5-builds:
        runs-on: [self-hosted, linux, x64, bosc, open]
        if: github.event.pull_request.draft == false
        needs: [pre-commit, testlib-quick-matrix, get-date]
        strategy:
            max-parallel: 3
            matrix:
                build-target: ${{ fromJson(needs.testlib-quick-matrix.outputs.build-matrix) }}
        env:
            CC: gcc
            CXX: g++
        steps:
            - uses: actions/checkout@v7

            - name: Check host build tools
              run: |
                  for tool in "$CC" "$CXX" scons python3 python3-config pkg-config protoc make; do
                      command -v "$tool" || exit 1
                  done
                  "$CC" --version
                  python3-config --includes
                  pkg-config --exists python3-embed protobuf zlib

            - name: Cache build/ALL
              uses: actions/cache/restore@v6
              if: ${{ endsWith(matrix.build-target, 'build/ALL/gem5.opt') }}
              with:
                  path: build/ALL
                  key: testlib-host-${{ runner.os }}-${{ runner.arch }}-gcc-all-${{ needs.get-date.outputs.date }}
                  restore-keys: |
                      testlib-host-${{ runner.os }}-${{ runner.arch }}-gcc-all-

            - name: Build gem5
              run: scons --no-compress-debug ${{ matrix.build-target }} -j "$CI_BUILD_JOBS"

            - name: Sanitize build-target for artifact name
              id: sanitize-build-target
              if: success() || failure()
              env:
                  BUILD_TARGET: ${{ matrix.build-target }}
              run: |
                  name=$(printf '%s' "$BUILD_TARGET" | tr '/.' '--')
                  echo "sanitized-build-target=$name" >> "$GITHUB_OUTPUT"

        # Upload the gem5 binary as an artifact.
        # Note: the "achor.txt" file is a hack to make sure the paths are
        # preserverd in the artifact. The upload-artifact action finds the
        # closest common directory and uploads everything relative to that.
        # E.g., if we upload "build/ARM/gem5.opt" and "build/RISCV/gem5.opt"
        # Then upload-artifact will upload "ARM/gem5.opt" and "RISCV/gem5.opt",
        # stripping the "build" directory. By adding the "anchor.txt" file, we
        # ensure the "build" directory is preserved.
            - run: echo "anchor" > anchor.txt
            - uses: actions/upload-artifact@v7
              with:
                  name: ci-tests-${{ github.run_number }}-testlib-quick-all-gem5-builds-${{ steps.sanitize-build-target.outputs.sanitized-build-target }}
                  path: |
                      build/*/gem5.*
                      anchor.txt

    testlib-quick-execution:
        name: quick-tests
        runs-on: [self-hosted, linux, x64, bosc, open]
        if: github.event.pull_request.draft == false
        needs: [pre-commit, testlib-quick-matrix, testlib-quick-gem5-builds]
        timeout-minutes: 360 # 6 hours
        strategy:
            fail-fast: false
            max-parallel: 4
            matrix:
                test-dir: ${{ fromJson(needs.testlib-quick-matrix.outputs.test-dirs-matrix) }}
        steps:
        # Checkout the repository then download the gem5.opt artifact.
            - uses: actions/checkout@v7
            - name: Check host Python
              run: python3 --version
            - uses: actions/download-artifact@v8
              name: Download gem5 artifacts
              with:
                  pattern: ci-tests-${{ github.run_number }}-testlib-quick-all-gem5-builds*
                  merge-multiple: true

        # Check that the gem5.opt artifact exists and is executable.
            - name: Chmod gem5.{opt,debug,fast} to be executable
              run: |
                  find . -name "gem5.opt" -exec chmod u+x {} \;
                  find . -name "gem5.debug" -exec chmod u+x {} \;
                  find . -name "gem5.fast" -exec chmod u+x {} \;

        # Run the testlib quick tests in the given directory.
            - name: Run quick ${{ matrix.test-dir }} tests
              id: run-tests
              working-directory: ${{ github.workspace }}/tests
              run: >-
                  ./main.py run --skip-build
                  -t "$CI_TEST_THREADS" --exclude-tags gcn_gpu
                  ${{ matrix.test-dir }}

        # Get the basename of the matrix.test-dir path (to name the artifact).
            - name: Sanitize test-dir for artifact name
              id: sanitize-test-dir
              if: success() || failure()
              run: echo "sanitized-test-dir=$(echo '${{ matrix.test-dir }}' | sed 's/\//-/g')" >> $GITHUB_OUTPUT

        # Upload the tests/testing-results directory as an artifact.
            - name: Upload results
              if: success() || failure()
              uses: actions/upload-artifact@v7
              with:
                  name: ci-tests-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}-testlib-quick-${{ steps.sanitize-test-dir.outputs.sanitized-test-dir
                      }}-status-${{ steps.run-tests.outcome }}-output
                  path: tests/testing-results
                  retention-days: 30

# Custom Ztt tests: floating-point unit tests and the gemm_fp32 workload.
    ztt-tests:
        name: Ztt float unit tests and GEMM FP32
        runs-on: [self-hosted, linux, x64, bosc, open]
        if: github.event.pull_request.draft == false
        needs: [pre-commit]
        timeout-minutes: 120
        defaults:
            run:
                shell: bash
        env:
            CC: gcc
            CXX: g++
        steps:
            - uses: actions/checkout@v7

            - name: Check host build tools
              run: |
                  for tool in "$CC" "$CXX" scons python3 python3-config pkg-config protoc make; do
                      command -v "$tool" || exit 1
                  done
                  "$CC" --version
                  python3-config --includes
                  pkg-config --exists python3-embed protobuf zlib

            - name: Build Ztt floating-point unit tests
              run: |
                  mkdir -p ci-results
                  scons build/RISCV/arch/riscv/insts/ztt_float.test.opt \
                    -j "$CI_BUILD_JOBS" 2>&1 | tee ci-results/ztt-float-build.log

            - name: Run Ztt floating-point unit tests
              timeout-minutes: 5
              run: |
                  build/RISCV/arch/riscv/insts/ztt_float.test.opt \
                    --gtest_output=xml:ci-results/ztt-float.xml \
                    2>&1 | tee ci-results/ztt-float.log

            - name: Install packaged AME toolchain
              run: |
                  git -c \
                    url."https://github.com/OpenXiangShan/AME_llvm.git".insteadOf=git@github.com:OpenXiangShan/AME_llvm.git \
                    submodule update --init --recursive
                  ./scripts/build_toolchain.sh

            - name: Build RISC-V gem5
              run: |
                  mkdir -p ci-results
                  scons --no-compress-debug build/RISCV/gem5.opt \
                    -j "$CI_BUILD_JOBS" 2>&1 | tee ci-results/ztt-build.log

            - name: Compare GEMM with checked-in reference
              timeout-minutes: 10
              run: |
                  make -C example/gemm_fp32 test-reference \
                    BUILD_DIR="$GITHUB_WORKSPACE/ci-results/reference"

            - name: Compare GEMM with host C golden
              timeout-minutes: 10
              run: |
                  make -C example/gemm_fp32 test-host-golden \
                    BUILD_DIR="$GITHUB_WORKSPACE/ci-results/host-golden"

            - name: Upload Ztt test results
              if: success() || failure()
              uses: actions/upload-artifact@v7
              with:
                  name: ztt-tests-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ci-results/
                  retention-days: 7

    ci-tests:
    # Keep one required check that fails when any dependency fails or skips.
        runs-on: ubuntu-24.04
        if: always() && github.event.pull_request.draft == false
        needs:
            - testlib-quick-execution
            - clang-fast-compilation
            - unittests-all-fast-opt
            - macos-compilation
            - pre-commit
            - clang-format-check
            - ztt-tests
        steps:
            - name: Check all required jobs
              env:
                  JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
              run: |
                  for result in $JOB_RESULTS; do
                      if [ "$result" != success ]; then
                          echo "Required job did not succeed: $result"
                          exit 1
                      fi
                  done
